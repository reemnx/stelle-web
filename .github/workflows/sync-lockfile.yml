name: Sync lockfile

# Run by hand when package.json changed without package-lock.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "Lockfile already in sync" && exit 0
          git commit -m "Sync package-lock.json with package.json"
          git push
